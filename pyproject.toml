[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "geoready-mcp"
version = "1.2.0"
description = "Zero-dependency MCP server by AI True Labs — AI Shopping & GMC Schema Auditor for Shopify ChatGPT Shopping (ACP), live OAI-SearchBot/PerplexityBot 403 WAF probes, /products.json price & variant GTIN parity, and OfferShippingDetails/hasMerchantReturnPolicy checks."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
authors = [
  { name = "AI True Labs", email = "support@aitruelabs.com" }
]
keywords = ["mcp", "shopify", "chatgpt-shopping", "google-merchant-center", "gmc", "json-ld", "gtin", "oai-searchbot", "seo", "geo", "model-context-protocol"]
dependencies = []

[project.urls]
Homepage = "https://geoready.aitruelabs.com"
Studio = "https://aitruelabs.com"
Repository = "https://github.com/yixuanrobot/geoready-mcp"

[project.scripts]
geoready-mcp = "geoready_mcp.server:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["geoready_mcp*"]
