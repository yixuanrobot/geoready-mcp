[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "geoready-mcp"
version = "1.0.0"
description = "Zero-dependency MCP server for 2026 Generative Engine Optimization (GEO), llms.txt validation, Accept: text/markdown token efficiency & JSON-LD schema auditing."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
authors = [
  { name = "AI True Labs", email = "support@aitruelabs.com" }
]
keywords = ["mcp", "geo", "seo", "llms-txt", "chatgpt-shopping", "perplexity", "json-ld", "model-context-protocol"]
dependencies = []

[project.urls]
Homepage = "https://geoready.aitruelabs.com"
Repository = "https://github.com/yixuanrobot/geoready-mcp"

[project.scripts]
geoready-mcp = "geoready_mcp.server:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["geoready_mcp*"]
